<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuddyBee</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #f5f5f5;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            margin: 5vh auto;
            background: #1e1e1e;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #6c4ab6;
            color: white;
        }

            .header h1 {
                margin: 0;
            }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #333;
            gap: 10px;
            background: #1e1e1e;
        }

            .input-area input {
                flex: 1;
                padding: 12px;
                border: 1px solid #444;
                border-radius: 8px;
                background: #2a2a2a;
                color: white;
            }

            .input-area button {
                padding: 12px 20px;
                border: none;
                border-radius: 8px;
                background: #6c4ab6;
                color: white;
                cursor: pointer;
            }

                .input-area button:hover {
                    opacity: 0.9;
                }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>BuddyBee</h1>
        </div>

        <div class="chat-box" id="chatBox">
        </div>

        <div class="input-area">

            <input type="text"
                   id="messageInput"
                   placeholder="Talk to BuddyBee...">

            <button id="sendButton">Send</button>

        </div>

    </div>


    <script>

        // One ID represents this entire conversation.
        const conversationId = crypto.randomUUID();

        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const chatBox = document.getElementById("chatBox");

        sendButton.addEventListener("click", sendMessage);


        async function sendMessage() {

            const message = messageInput.value.trim();

            if (message === "") {
                return;
            }

            addMessage("You", message);

            messageInput.value = "";


            try {

                const response = await fetch(
                    "https://localhost:7177/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            conversationId: conversationId,
                            message: message
                        })
                    }
                );


                const data = await response.json();

                addMessage("BuddyBee", data.reply);


            } catch (error) {

                addMessage(
                    "BuddyBee",
                    "I couldn't connect to the BuddyBee API."
                );

                console.error(error);
            }
        }


        function addMessage(sender, text) {

            const messageElement = document.createElement("p");

            messageElement.innerHTML =
                `<strong>${sender}:</strong> ${text}`;

            chatBox.appendChild(messageElement);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

    </script>

</body>

</html>
